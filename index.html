<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amigo Oculto 2026</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg,#fff7fa,#f4e7ef);
  color: #34242c;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 28px 20px 50px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.gift {
  font-size: 55px;
}

h1 {
  margin: 8px 0;
  font-size: 31px;
}

.subtitle {
  color: #7c6872;
  line-height: 1.5;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: 700;
  margin: 18px 0 8px;
}

select {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #ddd;
  background: white;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  background: #252025;
  color: white;
  font-size: 17px;
  font-weight: 700;
}

button:disabled {
  opacity: .55;
}

.message {
  display: none;
  margin-top: 20px;
  padding: 16px;
  border-radius: 14px;
  text-align: center;
  font-weight: 600;
  line-height: 1.5;
}

.success {
  background: #e8f8ee;
  color: #166534;
}

.error {
  background: #ffe9e9;
  color: #9b1c1c;
}

.info {
  margin-top: 25px;
  text-align: center;
  color: #7c6872;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="gift">🎁</div>
    <h1>Amigo Oculto 2026</h1>

    <div class="subtitle">
      Escolhe apenas o teu nome.
      <br>
      O site vai sortear automaticamente uma marca disponível para ti.
    </div>
  </div>

  <div class="card">

    <label for="person">👤 O teu nome</label>

    <select id="person">
      <option value="">Seleciona o teu nome</option>
      <option>Sany</option>
      <option>Any</option>
      <option>Weza</option>
      <option>Luyana</option>
      <option>Kátila</option>
      <option>Maury</option>
      <option>Lizandra</option>
      <option>Yara</option>
      <option>Solange</option>
      <option>Carina</option>
    </select>

    <button id="confirmButton">
      Sortear a minha marca 🎁
    </button>

    <div id="message" class="message"></div>

  </div>

  <div class="info">
    🔒 Cada pessoa recebe apenas uma marca e nenhuma marca será repetida.
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  runTransaction
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAgTuvHCBDo-6gKABBluzl_cz2vyewcpD4",
  authDomain: "amigo-oculto-2026.firebaseapp.com",
  databaseURL: "https://amigo-oculto-2026-default-rtdb.firebaseio.com",
  projectId: "amigo-oculto-2026",
  storageBucket: "amigo-oculto-2026.firebasestorage.app",
  messagingSenderId: "891182604847",
  appId: "1:891182604847:web:e6164a307b421e1fe35cda"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const selectionsRef = ref(database, "selections");

const personSelect = document.getElementById("person");
const button = document.getElementById("confirmButton");
const message = document.getElementById("message");

const brands = [
  "Versace Jeans",
  "Emporio Armani",
  "Lacoste",
  "Aldo",
  "DKNY",
  "MK",
  "Guess",
  "CK",
  "Love Moschino",
  "Furla"
];

let currentSelections = {};

function showMessage(text, type) {
  message.className = "message " + type;
  message.style.display = "block";
  message.innerHTML = text;
}

function refreshOptions() {
  const usedPeople = Object.keys(currentSelections);

  Array.from(personSelect.options).forEach(option => {
    if (!option.value) return;

    if (usedPeople.includes(option.value)) {
      option.disabled = true;
      option.textContent = option.value.replace(" ✓", "") + " ✓";
    } else {
      option.disabled = false;
      option.textContent = option.value.replace(" ✓", "");
    }
  });
}

onValue(
  selectionsRef,
  snapshot => {
    currentSelections = snapshot.val() || {};
    refreshOptions();
  },
  error => {
    console.error(error);

    showMessage(
      "⚠️ Não foi possível ligar à lista do sorteio. Atualiza a página e tenta novamente.",
      "error"
    );
  }
);

button.addEventListener("click", async () => {

  const person = personSelect.value;

  if (!person) {
    showMessage(
      "⚠️ Seleciona primeiro o teu nome.",
      "error"
    );
    return;
  }

  button.disabled = true;
  button.textContent = "A sortear... 🎁";

  let reason = "";
  let assignedBrand = "";

  try {

    const result = await runTransaction(
      selectionsRef,
      selections => {

        selections = selections || {};

        if (selections[person]) {
          reason = "person";
          assignedBrand = selections[person];
          return;
        }

        const usedBrands = Object.values(selections);

        const availableBrands = brands.filter(
          brand => !usedBrands.includes(brand)
        );

        if (availableBrands.length === 0) {
          reason = "noBrands";
          return;
        }

        const randomIndex = Math.floor(
          Math.random() * availableBrands.length
        );

        assignedBrand = availableBrands[randomIndex];
        selections[person] = assignedBrand;

        return selections;
      },
      {
        applyLocally: false
      }
    );

    if (result.committed) {

      showMessage(
        "🎉 " + person +
        ", a tua marca sorteada foi <strong>" +
        assignedBrand +
        "</strong>!<br><br>🔒 A marca ficou reservada para ti.",
        "success"
      );

      personSelect.value = "";

    } else if (reason === "person") {

      showMessage(
        "🔒 Este nome já participou no sorteio.",
        "error"
      );

    } else if (reason === "noBrands") {

      showMessage(
        "⚠️ Todas as marcas já foram sorteadas.",
        "error"
      );

    } else {

      showMessage(
        "⚠️ Não foi possível concluir o sorteio. Tenta novamente.",
        "error"
      );
    }

  } catch (error) {

    console.error(error);

    showMessage(
      "⚠️ Ocorreu um erro ao guardar o sorteio. Tenta novamente.",
      "error"
    );

  } finally {

    button.disabled = false;
    button.textContent = "Sortear a minha marca 🎁";

  }

});

</script>

</body>
</html>
